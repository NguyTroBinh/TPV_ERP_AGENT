[project]
name = "erp-agentic-chatbot"
version = "0.1.0"
description = "ERP Agentic Chatbot — ReAct loop với MCP tools"
requires-python = ">=3.11"

dependencies = [
    # ── Web framework ─────────────────────────────────
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "starlette>=0.50.0",
    "python-multipart>=0.0.21",     # file upload
    "sse-starlette>=3.3.2",         # streaming responses
    "aiofiles>=25.1.0",

    # ── Config ────────────────────────────────────────
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",

    # ── LLM & LangChain ──────────────────────────────
    "langchain>=1.2.3",
    "langchain-core>=1.2.7",
    "langchain-openai>=1.1.7",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.1.0",
    "langchain-experimental>=0.4.1",
    "openai>=2.15.0",
    "ollama",

    # ── Database ──────────────────────────────────────
    "asyncpg>=0.31.0",
    "SQLAlchemy>=2.0.45",

    # ── Vector store ──────────────────────────────────
    "qdrant-client>=1.16.2",
    "chromadb>=1.4.0",

    # ── Embeddings & ML ───────────────────────────────
    "sentence-transformers>=5.2.0",
    "transformers>=5.1.0",
    "torch>=2.8.0",
    "fastembed>=0.7.4",
    "FlagEmbedding>=1.3.5",

    # ── Redis ─────────────────────────────────────────
    "redis[hiredis]>=7.1.0",
    "ulid",

    # ── Auth ──────────────────────────────────────────
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",

    # ── HTTP client ───────────────────────────────────
    "httpx>=0.28.1",
    "aiohttp>=3.13.3",

    # ── MCP ───────────────────────────────────────────
    "mcp>=1.26.0",
    "fastmcp>=3.1.1",

    # ── Logging ───────────────────────────────────────
    "structlog>=25.5.0",

    # ── Document processing ───────────────────────────
    "PyMuPDF>=1.26.7",
    "pymupdf4llm>=0.2.9",
    "pypdfium2>=5.3.0",
    "pillow>=11.3.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "markitdown[all]>=0.1.4",
    "beautifulsoup4>=4.14.3",

    # ── Utils ─────────────────────────────────────────
    "orjson>=3.11.5",
    "tenacity>=9.1.2",
    "pydantic[email]>=2.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.1",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "config", "ingestion", "mcp_tools", "memory", "services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
