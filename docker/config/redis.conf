# ═══════════════════════════════════════════════════════
# Redis Configuration — Production
# Path in container: /usr/local/etc/redis/redis.conf
# Password: --requirepass ${REDIS_PASSWORD} (command line)
# ═══════════════════════════════════════════════════════

# ── NETWORK ──────────────────────────────────────────
bind 0.0.0.0
protected-mode yes
port 6379

# ── MEMORY ───────────────────────────────────────────
maxmemory 2gb
maxmemory-policy allkeys-lru

# ── PERSISTENCE ──────────────────────────────────────
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec

# ── PERFORMANCE ──────────────────────────────────────
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ── GENERAL ──────────────────────────────────────────
databases 16
loglevel notice
logfile ""