########################################################
# docker/compose.yml — Development / Production
#
# Chạy infra (từ thư mục gốc project):
#   docker compose -f docker/compose.yml --env-file .env up postgres redis qdrant pgadmin redisinsight -d
#
# Chạy toàn bộ:
#   docker compose -f docker/compose.yml --env-file .env up --build
#
# UI quản lý:
#   pgAdmin      → http://localhost:5050          (PostgreSQL)
#   RedisInsight → http://localhost:8001          (Redis)
#   Qdrant UI    → http://localhost:6333/dashboard
########################################################

name: erp_agentic_chatbot

services:

  # ── App (FastAPI + Agent) ──────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: erp-chatbot-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
      - hf-cache:/app/.cache/huggingface
    env_file:
      - ../.env
    environment:
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - internal

  # ── PostgreSQL ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-erp_chatbot}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../scripts/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-erp_chatbot}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ── pgAdmin 4 (PostgreSQL UI) ──────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erp-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./config/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── Redis ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis-prod
    restart: unless-stopped
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── RedisInsight (Redis UI) ────────────────────────
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "8001:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Qdrant ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:gpu-nvidia-latest
    container_name: qdrant-prod
    restart: unless-stopped
    command: >
      ./qdrant --config-path /qdrant/config/production.yaml
    ports:
      - "6333:6333"   # REST API + Dashboard UI
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
      - ./config/qdrant.yml:/qdrant/config/production.yaml:ro
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
      - QDRANT__LOG_LEVEL=INFO
    mem_limit: 8g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  pg-data:
  pgadmin-data:
  hf-cache:
  redis-data:
    name: chatbot-redis-prod
    external: true
  redisinsight-data:
    name: chatbot-redisinsight-prod
    external: true
  qdrant-data:
    name: chatbot-qdrant-prod
    external: true

networks:
  internal:
    driver: bridge
