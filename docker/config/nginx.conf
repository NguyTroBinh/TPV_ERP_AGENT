# ═══════════════════════════════════════════════════════
# Nginx Reverse Proxy — ERP Agentic Chatbot
# Path in container: /etc/nginx/nginx.conf
# ═══════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Security Headers ─────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── File upload size (cho ingestion) ─────────────
    client_max_body_size 50m;

    # ── Upstreams ────────────────────────────────────
    upstream app {
        server app:8000;
    }

    upstream ingestion {
        server ingestion:8002;
    }

    # ── HTTP → HTTPS redirect ────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # SSL certs (mount từ docker/certs/)
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ── Chat API ────────────────────────────────
        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── SSE streaming (chat) ────────────────────
        location /api/chat/stream {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            # Timeout dài cho streaming
            proxy_read_timeout 300s;
        }

        # ── Upload API (route đến ingestion) ────────
        location /api/upload {
            proxy_pass http://ingestion;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Timeout dài cho upload + OCR processing
            proxy_read_timeout 600s;
            client_max_body_size 50m;
        }

        # ── Health check ────────────────────────────
        location /health {
            proxy_pass http://app;
            access_log off;
        }
    }
}